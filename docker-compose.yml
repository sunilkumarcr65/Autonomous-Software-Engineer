services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: ase, POSTGRES_PASSWORD: ase, POSTGRES_DB: ase}
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ase:ase@postgres:5432/ase
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: development-secret
      CORS_ORIGINS: http://localhost:5173
    ports: ['8000:8000']
    depends_on: [postgres,redis]
  frontend:
    build: ./frontend
    ports: ['5173:5173']
    depends_on: [backend]
volumes: {postgres_data: {}}
